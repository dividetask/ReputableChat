# Reputation parameters.
#
# Numbers are quoted strings so YAML cannot coerce them to binary floats before
# BigDecimal sees them. A user's own config may override any key; a blank or
# absent key tracks the default here, an explicitly set one is theirs for good.

precision:
  scale: 18

constants:
  # Ladder decay. Your own rating is worth (1-k), the whole rest of the network
  # worth k. Coupled to the vote curve: requires A < k**3 < 4A.
  k: "0.1"

ladder:
  max_hops: 7
  # The most accounts one walk will reach. Traversal stops at whichever of the
  # two limits comes first: a positive-only graph still branches, so a hop count
  # alone does not bound how much gets fetched.
  max_accounts: 5000

gate:
  # Only configs of people rated above this are read.
  min_rating: "0"

actions:
  friend:
    value: "0.5"
  report:
    # Absolute within one rater, only -1 in the mean across raters.
    value: "-1.0"

vote_curve:
  # sign(x) * min(cap, A*x^2 + B*|x|)
  # A is pinned to (k**3/4, k**3) by the report rule. B > 0 narrows that window.
  cap: "0.5"
  a: "0.0004"
  b: "0"

display:
  # Blocked at or below this, Tolerated above it, Trusted at trusted_at.
  visible_above: "0"
  # Depth 2 tops out at 0.009, so Trusted means you rated them or someone you
  # rated did.
  trusted_at: "0.01"
  # Show users nobody has rated. Off by default - unrated is how new accounts
  # and spam accounts both start.
  show_unrated: false
  # After you report someone, their messages show as "blocked" with an undo for
  # this long, then vanish. Only covers people you blocked yourself, and only
  # until you log off.
  block_grace_seconds: 3600

chain:
  # A record acknowledges the most recent record its author has seen whose
  # author they rate above this. Subjective by construction: it is read from
  # the acknowledging user's own attestation under their own config, so two
  # people disagree about which references were legitimate and the server --
  # which never computes a reputation -- cannot check it at all.
  # Defaults to trusted_at, so "acknowledge people you or your contacts rated".
  min_reputation_to_acknowledge: "0.01"

attestation:
  # How far the published cache of calculated scores reaches. A cache for other
  # readers, never an input to their own scores; see docs/project/chain.md.
  published_hops: 3
  # Republish the whole attestation after either limit, whichever comes first,
  # superseding every adjustment against the previous revision.
  #
  # Both are floors on when pending changes get published, not schedules. With
  # nothing pending, nothing is published: a second document stating exactly
  # what the first one said is noise, and an account that was created and never
  # used leaves nothing behind but its identity declaration. The clock is also
  # only ever read while somebody is signed in, so it cannot fire for a dormant
  # account anyway.
  #
  # Only score-changing events count toward the tally -- posting a comment
  # cannot move a number in the file, so counting it would republish for no
  # reason.
  #
  # Neither limit is a rate limit on vouching. Ten friendships in a row meet
  # the threshold immediately, which is fine: the point is to keep one
  # attestation from being re-signed and re-uploaded per emote, not to slow
  # anybody down.
  resubmit_after_changes: 10
  resubmit_after_seconds: 604800
  # The multiplier on what somebody recommends. Stored per user only when
  # overridden, so an attestation carries a trust entry for the handful of
  # people it has been set on rather than for everyone.
  default_trust: "1"
  blocked_trust: "0"

session:
  # MVP only: configs are taken on trust. Flip on to verify every signature.
  verify_signatures: false
  # Reports that move someone to Blocked mid-session without recalculating,
  # as hops => how many reporters at that distance are needed.
  report_blocks:
    "0": 1
    "1": 1
    "2": 2

seed:
  wordlist: bip39-english
  # 8 words = 80 bits of entropy after the checksum. See docs/project/identity.md.
  min_words: 8
  checksum_bits: 8
  kdf:
    algorithm: argon2id
    memory_kib: 65536
    iterations: 3
    parallelism: 1
    domain: "reputablechat:seed:v1"
    # A second, separate domain deriving the symmetric key the private vault is
    # encrypted under. Ed25519 cannot encrypt and the signing key is a
    # non-extractable WebCrypto key whose bytes can never be read back, so the
    # vault key has to come from the seed independently rather than from the
    # identity key. Versioned for the same reason `domain` is: changing it
    # strands every existing vault.
    vault_domain: "reputablechat:vault:v1"
