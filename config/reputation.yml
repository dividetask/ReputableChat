# Reputation parameters.
#
# Numbers are quoted strings so YAML cannot coerce them to binary floats before
# BigDecimal sees them. A user's own config may override any key; a blank or
# absent key tracks the default here, an explicitly set one is theirs for good.

precision:
  scale: 18

constants:
  # Ladder decay. Your own rating is worth (1-k), the whole rest of the network
  # worth k. Coupled to the vote curve: requires A < k**3 < 4A.
  k: "0.1"

ladder:
  max_hops: 7
  # Traversal also stops here, whichever limit is reached first.
  max_configs: 5000

gate:
  # Only configs of people rated above this are read.
  min_rating: "0"

actions:
  friend:
    value: "0.5"
  report:
    # Absolute within one rater, only -1 in the mean across raters.
    value: "-1.0"

vote_curve:
  # sign(x) * min(cap, A*x^2 + B*|x|)
  # A is pinned to (k**3/4, k**3) by the report rule. B > 0 narrows that window.
  cap: "0.5"
  a: "0.0004"
  b: "0"

display:
  # Blocked at or below this, Tolerated above it, Trusted at trusted_at.
  visible_above: "0"
  # Depth 2 tops out at 0.009, so Trusted means you rated them or someone you
  # rated did.
  trusted_at: "0.01"
  # Show users nobody has rated. Off by default - unrated is how new accounts
  # and spam accounts both start.
  show_unrated: false
  # After you report someone, their messages show as "blocked" with an undo for
  # this long, then vanish. Only covers people you blocked yourself, and only
  # until you log off.
  block_grace_seconds: 3600

session:
  # MVP only: configs are taken on trust. Flip on to verify every signature.
  verify_signatures: false
  # Reports that move someone to Blocked mid-session without recalculating,
  # as hops => how many reporters at that distance are needed.
  report_blocks:
    "0": 1
    "1": 1
    "2": 2

seed:
  wordlist: bip39-english
  # 8 words = 80 bits of entropy after the checksum. See docs/project/identity.md.
  min_words: 8
  checksum_bits: 8
  kdf:
    algorithm: argon2id
    memory_kib: 65536
    iterations: 3
    parallelism: 1
    domain: "reputablechat:seed:v1"
