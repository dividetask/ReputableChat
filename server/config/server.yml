# Agnostic server settings.
#
# Every key has a built-in default (lib/agnostic/settings.rb), so this file
# only needs what a deployment changes. A value that is missing, unparseable or
# out of range falls back to the default rather than to zero: a typo here must
# not be able to switch the server off quietly.
#
# Environment variables win over this file for the keys deployment tooling is
# most likely to inject: DATABASE_URL, DATA_DIR, GENESIS, PEERS (comma
# separated), HOST_URL and HEARTBEAT_INTERVAL_SECONDS.

# Where the server keeps its database and its host account. That account's
# working and master seed phrases are written here 0600 on first boot; move
# the master phrase (host-master.seed) off the machine.
data_dir: "data"

# The genesis record this server's chain starts from. %{environment} is
# replaced by RACK_ENV (development unless set). Production has no committed
# genesis yet, so a production server refuses to boot until one is placed here.
genesis: "config/genesis/%{environment}.json"

# This server's own account, the host account, declared on first boot.
host:
  handle: "Agnostic server"
  bio: ""
  # The address other servers reach this one at, such as
  # "https://chain.example.org" or "http://203.0.113.7:9292". It goes into
  # the host account's identity declaration, which is how peers find a server
  # by its account. Without one, peers cannot send this server live updates.
  # Changing any of these three publishes a new declaration on the next boot.
  # url: "https://chain.example.org"

heartbeat:
  # The rules set a floor of 480 seconds between one publisher's heartbeats and
  # a guideline of about 600. Anything below 480 is raised to it.
  interval_seconds: "600"

records:
  # Guideline, section 10: refuse records whose ts is far from this server's
  # clock. Only the future is checked; see server/README.md for why the past
  # is left to the split rule.
  max_future_seconds: "600"

pending:
  # Records that arrived before something they acknowledge are held here until
  # it does. Bounded, so they cannot fill the disk.
  max_records: "10000"
  max_age_seconds: "3600"

peers:
  # Servers to sync with after each heartbeat: pushing what arrived here,
  # offering the heartbeat, and pulling what they hold. Base URLs, such as
  # "https://chain.example.org". `rake setup` asks for these and writes them
  # to data/<environment>/settings.yml; any listed here are added to those.
  # More are learned from the records passed along (server/README.md).
  urls: []
  # A peer's heartbeat whose ts is further than this from this server's clock,
  # either way, gets the peer ignored (rake ignored, rake forgive).
  max_clock_skew_seconds: "600"
  # How long such a peer is ignored: a week.
  ignore_seconds: "604800"
  # A server not reached for this long is forgotten, at its next failed try: a
  # week. A new identity declaration from it, or a sync from it, brings it back.
  forget_after_seconds: "604800"
  # The wait before the next try after a failed one: first_seconds after the
  # first failure, multiplied by multiplier for each failure after that, and
  # never more than max_seconds. With these: 10 minutes, 20, 40, ... a day.
  retry:
    first_seconds: "600"
    multiplier: "2"
    max_seconds: "86400"
  # How many missing ancestors one pull may fetch from a peer by hash.
  fetch_missing: "1000"
  timeout_seconds: "10"

limits:
  # One POST, in bytes.
  request_bytes: "8388608"
  # Records in one POST, and in one page of GET /api/records.
  batch_records: "500"
  page_records: "500"
