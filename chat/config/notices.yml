# Notice kinds this client knows how to show.
#
# The rules accept a notice of any kind and give meaning to four of them
# (compromised, key-change, master-key-change, quorum). This list is narrower
# and is the chat's own: the kinds a client renders as an announcement, and the
# only kinds this server accepts from its own clients. A notice of another kind
# passed on by another server is still held and served; a client that does not
# know the kind does not show it.
#
# Adding a kind is cheap. Removing one is not -- notices already signed under
# it stay on the chain forever, so a client has to keep being able to render
# what it no longer offers.

kinds:
  - policy      # a rule changed, or a rule stated for the first time
  - outage      # planned or unplanned unavailability
  - advisory    # something users should know; no action required
