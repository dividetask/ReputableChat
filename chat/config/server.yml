# Server settings.
#
# Each key can be overridden by the matching environment variable (ORIGIN,
# DATABASE_URL, IMAGE_ROOT). The environment wins, so deployment tooling can
# inject a value without editing a file baked into an image; this file is the
# default for everything else.

# The addresses this server is reached at. Optional, and unset by default.
#
# Unset, the server takes its address from each request, so the same code runs
# at any domain or IP with nothing to configure. Behind a reverse proxy the
# proxy must pass the browser's Host and scheme; Caddy does by default, and
# nginx needs:
#
#   proxy_set_header Host $host;
#   proxy_set_header X-Forwarded-Proto $scheme;
#
# Set, logins are accepted only when signed for one of the addresses listed --
# one, or a list, or in ORIGIN separated by commas. That also stops a malicious
# server relaying a terminal client's login (script/tim.rb) to this one, which
# an unset origin cannot; browsers are no worse off either way. A browser at an
# address not listed is told which address to use.
#
# origin:
#   - "https://chat.example.org"
#   - "http://203.0.113.7:9292"

# The agnostic server this chat runs beside: it holds the chain, judges every
# record against the rules and syncs with other servers. The chat passes its
# clients' records to it and keeps a copy of the ones it shows. CHAIN_URL
# overrides. Start one with `cd server && bundle exec puma` (port 9393).
chain_url: "http://localhost:9393"

# The host account's working seed, which lives outside both apps (host/ at the
# root of the repository): a chat server shares its agnostic server's host
# account, and refuses to boot if this is not it. HOST_SEED
# overrides; %{environment} is development or production.
host_seed: "../host/%{environment}/host.seed"

# Where other chat servers reach this one to fetch files its people uploaded.
# Announced on the chain when first set and whenever it changes; unset, this
# server does not announce itself. PUBLIC_URL overrides.
# url: "https://chat.example.org"

# Whether other chat servers at private, loopback or link-local addresses may
# be fetched from. Unset: yes in development, no in production, where they
# must also be https. ALLOW_PRIVATE_PEERS overrides.
# allow_private_peers: false

database_url: "sqlite://data/reputablechat.db"
image_root: "data/images"

# SESSION_SECRET is deliberately absent: it is a secret and this file is in the
# repository. Set it in the environment when you deploy. Without it a random
# one is generated at boot, which is fine locally but signs everyone out on
# every restart.

# Size limits, and one piece of advice.
#
# These are an operator's decision, not a property of the protocol -- a server
# with more disk can afford a larger vault. They are served at /api/limits so a
# client knows them before it tries to save, rather than discovering the ceiling
# by being refused.
#
# Each can be overridden by the matching environment variable, named for the
# key in upper case: VAULT_BYTES, IMAGE_BYTES, and so on.
#
# A value that is missing, unparseable or not positive falls back to the built
# in default rather than to zero. A zero here would refuse every save, and a
# typo in this file must not be able to do that quietly.
limits:
  # The vault's ciphertext. The server cannot see inside it, so this is the
  # only limit it has -- it cannot count your friends, so it counts your bytes.
  vault_bytes: 1048576
  image_bytes: 262144
  # The next four are stricter than the rules allow, and apply only to records
  # this server's own clients send.
  message_bytes: 4000
  bio_bytes: 280
  # An attestation holds an entry per person its author has an opinion about, so
  # it is the one record whose size the author decides. Bounded in bytes rather
  # than in entries: the bytes are what the server has to hold and serve. The
  # rules allow 1 MiB of scores and derived together; this counts the whole
  # record.
  attestation_bytes: 1048576
  notice_bytes: 16000
  # Advice rather than a limit: nothing rejects a vault for holding more. It
  # tells a client how many first-seen entries to keep before pruning, since it
  # is the client that has to decide what to drop. Friends and blocked accounts
  # are never what gets dropped.
  seen_entries: 5000
  # Also advice: how often a client should push its vault while signed in. It
  # is local first, so this bounds how much is lost when a tab dies rather than
  # how often anything is allowed to happen.
  vault_sync_seconds: 3600
